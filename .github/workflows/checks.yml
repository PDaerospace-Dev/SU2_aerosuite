# Runs on every pull request and on main: ruff (mistakes, not style) and the test suite on several cores.
# The tests need neither SU2 nor Slurm: tests/fixtures/fake_sweep.py and fake_slurm.py stand in for them.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen  # the legacy PyQt5 smoke test, without a display
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: uv sync
      - run: uv run pytest -q -n auto
